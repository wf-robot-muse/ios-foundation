name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (macOS runner, latest stable Xcode)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Show available destinations (diagnostics)
        run: |
          xcrun simctl list devices available | head -40 || true
          xcodebuild -project iOSFoundation.xcodeproj -scheme iOSFoundation -showdestinations || true

      - name: Build for simulator (unsigned)
        run: |
          xcodebuild build \
            -project iOSFoundation.xcodeproj \
            -scheme iOSFoundation \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-build
          path: ~/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: warn

      - name: Archive for device (unsigned)
        run: |
          xcodebuild archive \
            -project iOSFoundation.xcodeproj \
            -scheme iOSFoundation \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/iOSFoundation.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Upload unsigned archive
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-archive
          path: ${{ runner.temp }}/iOSFoundation.xcarchive
          if-no-files-found: warn
