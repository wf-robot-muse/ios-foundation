name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (macOS runner, latest stable Xcode)
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Pick an available iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data.get('devices', {}).items():
              if 'iOS' not in runtime:
                  continue
              for d in devices:
                  if 'iPhone' in d.get('name', '') and d.get('isAvailable', False):
                      print(d['udid'])
                      sys.exit(0)
          ")
          if [ -z "$UDID" ]; then
            echo "No iPhone simulator found on this runner image; failing so the gap is visible."
            xcrun simctl list devices available
            exit 1
          fi
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          echo "Using simulator UDID: $UDID"

      - name: Build for simulator (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project iOSFoundation.xcodeproj \
            -scheme iOSFoundation \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${SIM_UDID}" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload simulator app artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOSFoundation-simulator-app
          path: build/DerivedData/Build/Products/Debug-iphonesimulator/iOSFoundation.app
          if-no-files-found: error

      - name: Archive for device (unsigned until signing is configured)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project iOSFoundation.xcodeproj \
            -scheme iOSFoundation \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/iOSFoundation.xcarchive \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOSFoundation-xcarchive
          path: build/iOSFoundation.xcarchive
          if-no-files-found: error
